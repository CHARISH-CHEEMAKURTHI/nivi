<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Nivi - Castle Level One</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27 shape-rendering=%27crispEdges%27%3E%3Crect width=%2716%27 height=%2716%27 fill=%27%231b1526%27/%3E%3Crect x=%273%27 y=%276%27 width=%2710%27 height=%278%27 fill=%27%239aa0ad%27/%3E%3Crect x=%273%27 y=%274%27 width=%272%27 height=%272%27 fill=%27%239aa0ad%27/%3E%3Crect x=%277%27 y=%274%27 width=%272%27 height=%272%27 fill=%27%239aa0ad%27/%3E%3Crect x=%2711%27 y=%274%27 width=%272%27 height=%272%27 fill=%27%239aa0ad%27/%3E%3Crect x=%277%27 y=%2710%27 width=%272%27 height=%274%27 fill=%27%235e3b20%27/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <canvas id="game"></canvas>
  <div id="hologram" hidden></div>

  <div id="hud">
    <div id="hud-top">
      <div class="res-bar serge" title="Serge">
        <i class="gem serge"></i>
        <span class="track"><i id="fill-serge"></i><b id="res-serge">0</b></span>
      </div>
      <div class="res-bar jade" title="Jade">
        <i class="gem jade"></i>
        <span class="track"><i id="fill-jade"></i><b id="res-jade">0</b></span>
      </div>
    </div>

    <div id="hud-stats">
      <div class="stat" title="Population"><span class="lbl">Pop</span><b id="hud-pop">0</b></div>
      <div class="stat" title="City happiness"><span class="lbl">Joy</span><b id="hud-happy">0</b></div>
      <div class="stat" title="Credits (karma)"><span class="lbl">Credits</span><b id="hud-credits">0</b></div>
      <div class="stat" title="Army housing"><span class="lbl">Army</span><b id="hud-army">0</b></div>
      <div class="stat" title="Season"><span class="lbl">Season</span><b id="hud-season">1</b></div>
    </div>

    <div id="objectives"></div>

    <div id="panel" hidden>
      <div id="panel-head"><span id="panel-title"></span><button class="close-x" data-action="close-panel" title="Close">✕</button></div>
      <div id="panel-body"></div>
    </div>

    <div id="bottom-bar">
      <div class="cluster">
        <button class="btn green big" data-action="open-build">Build</button>
        <button class="btn" data-action="open-army">Army</button>
        <button class="btn gold" data-action="open-kingdom">Kingdom</button>
      </div>
      <div class="cluster">
        <button class="btn gold" data-action="collect-all">Collect</button>
        <button class="btn wood" data-action="open-menu">Menu</button>
        <button class="btn attack big" data-action="open-attack">Attack</button>
      </div>
    </div>

    <div id="place-bar" hidden>
      <span id="place-label"></span>
      <button class="btn ok small" data-action="place-confirm">Place</button>
      <button class="btn small" data-action="place-rotate" hidden>Rotate</button>
      <button class="btn danger small" data-action="place-cancel">Cancel</button>
    </div>

    <div id="battle-hud" hidden>
      <div id="battle-top">
        <div class="loot"><span class="lbl">Time</span><span id="b-time">2:00</span></div>
        <div class="loot"><span class="lbl">Destroyed</span><span id="b-destroy">0%</span></div>
        <div class="loot"><span id="b-stars">☆☆☆</span></div>
        <div class="loot"><i class="gem serge sm"></i><span id="b-serge">0</span></div>
        <div class="loot"><i class="gem jade sm"></i><span id="b-jade">0</span></div>
        <button class="btn danger" data-action="battle-end">End Battle</button>
      </div>
      <div id="battle-hint">Select a troop below, then tap the ground to deploy.</div>
      <div id="battle-directives">
        <span id="b-selected">All troops</span>
        <button class="btn small gold" data-action="cmd-hold">Hold</button>
        <button class="btn small green" data-action="cmd-proceed">Proceed</button>
        <button class="btn small wood" data-action="cmd-deselect">Deselect</button>
      </div>
      <div id="troop-bar"></div>
    </div>

    <div id="toast" hidden></div>
    <div id="modal" hidden><div id="modal-body"></div></div>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
