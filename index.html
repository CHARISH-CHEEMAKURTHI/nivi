<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Nivi - Castle Level One</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27 shape-rendering=%27crispEdges%27%3E%3Crect width=%2716%27 height=%2716%27 fill=%27%231b1526%27/%3E%3Crect x=%273%27 y=%276%27 width=%2710%27 height=%278%27 fill=%27%239aa0ad%27/%3E%3Crect x=%273%27 y=%274%27 width=%272%27 height=%272%27 fill=%27%239aa0ad%27/%3E%3Crect x=%277%27 y=%274%27 width=%272%27 height=%272%27 fill=%27%239aa0ad%27/%3E%3Crect x=%2711%27 y=%274%27 width=%272%27 height=%272%27 fill=%27%239aa0ad%27/%3E%3Crect x=%277%27 y=%2710%27 width=%272%27 height=%274%27 fill=%27%235e3b20%27/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <canvas id="game"></canvas>
  <div id="hologram" hidden></div>

  <div id="hud">
    <div id="hud-top">
      <div class="pill res" id="pill-serge" title="Serge"><i class="dot serge"></i><span id="res-serge">0</span></div>
      <div class="pill res" id="pill-jade" title="Jade"><i class="dot jade"></i><span id="res-jade">0</span></div>
      <div class="pill" title="Population"><span class="lbl">POP</span><span id="hud-pop">0</span></div>
      <div class="pill" title="City happiness"><span class="lbl">JOY</span><span id="hud-happy">0</span></div>
      <div class="pill" title="Credits (karma)"><span class="lbl">CRED</span><span id="hud-credits">0</span></div>
      <div class="pill" title="Army housing"><span class="lbl">ARMY</span><span id="hud-army">0</span></div>
      <div class="pill" title="Season"><span class="lbl">SEASON</span><span id="hud-season">1</span></div>
    </div>

    <div id="objectives"></div>

    <div id="panel" hidden>
      <div id="panel-head"><span id="panel-title"></span><button class="btn small" data-action="close-panel">✕</button></div>
      <div id="panel-body"></div>
    </div>

    <div id="bottom-bar">
      <button class="btn" data-action="open-build">Build</button>
      <button class="btn" data-action="open-army">Army</button>
      <button class="btn" data-action="open-kingdom">Kingdom</button>
      <button class="btn" data-action="collect-all">Collect</button>
      <button class="btn attack" data-action="open-attack">Attack</button>
      <button class="btn" data-action="open-menu">Menu</button>
    </div>

    <div id="place-bar" hidden>
      <span id="place-label"></span>
      <button class="btn ok" data-action="place-confirm">Place</button>
      <button class="btn" data-action="place-rotate" hidden>Rotate</button>
      <button class="btn danger" data-action="place-cancel">Cancel</button>
    </div>

    <div id="battle-hud" hidden>
      <div id="battle-top">
        <div class="pill"><span class="lbl">TIME</span><span id="b-time">2:00</span></div>
        <div class="pill"><span class="lbl">DESTROYED</span><span id="b-destroy">0%</span></div>
        <div class="pill"><span class="lbl">STARS</span><span id="b-stars">☆☆☆</span></div>
        <div class="pill res"><i class="dot serge"></i><span id="b-serge">0</span></div>
        <div class="pill res"><i class="dot jade"></i><span id="b-jade">0</span></div>
        <button class="btn danger" data-action="battle-end">End Battle</button>
      </div>
      <div id="battle-hint">Select a troop below, then tap the ground to deploy.</div>
      <div id="battle-directives">
        <span id="b-selected">All troops</span>
        <button class="btn small" data-action="cmd-hold">Hold</button>
        <button class="btn small" data-action="cmd-proceed">Proceed</button>
        <button class="btn small" data-action="cmd-deselect">Deselect</button>
      </div>
      <div id="troop-bar"></div>
    </div>

    <div id="toast" hidden></div>
    <div id="modal" hidden><div id="modal-body"></div></div>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
